name: nightly-eval

# The engine. Runs the eval suite on a schedule, commits the results JSON back
# to the repo; the Vercel/Next.js dashboard reads that file. Public-repo CPU
# minutes are free, so this costs nothing beyond the (free-tier) Groq calls.

on:
  schedule:
    # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) so the dashboard stays
    # continuously fresh on live data. GitHub may delay scheduled runs under
    # load; that's fine — a missed slot just means the next one refreshes it.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger a run by hand from the Actions tab

# Never let two runs overlap (they'd race on the results commit).
concurrency:
  group: nightly-eval
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit results back to the repo

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/requirements.txt

      - name: Install dependencies
        run: pip install -r eval/requirements.txt

      - name: Self-test the statistics
        working-directory: eval
        run: pytest -q

      - name: Run eval suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python eval/run_eval.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json public/data/history.jsonl
          if git diff --staged --quiet; then
            echo "No change in results — nothing to commit."
          else
            git commit -m "chore(eval): nightly run $(date -u +'%Y-%m-%d')"
            git push
          fi
