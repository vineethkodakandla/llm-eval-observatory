name: nightly-eval

# The engine. Runs the eval suite on a schedule, commits the results JSON back
# to the repo; the Vercel/Next.js dashboard reads that file. Public-repo CPU
# minutes are free, so this costs nothing beyond the (free-tier) Groq calls.

on:
  schedule:
    # Once a day at 00:30 UTC. Rationale:
    #   * Groq's free-tier DAILY quota resets at 00:00 UTC — running at 00:30
    #     means the run always starts with fresh quota, so it never fails just
    #     because an earlier run spent the day's budget. (Twice-daily at 12h
    #     overran the quota once the 4th/autopilot track pushed each run to
    #     ~770 calls, and every model 429'd — see run 30474931921.)
    #   * The 30-min offset (not 00:00) avoids racing the quota reset and the
    #     usual GitHub scheduled-run start delay under load.
    # A missed slot just means the next night refreshes it; the run also refuses
    # to overwrite good data with an all-skipped snapshot, so a bad night is safe.
    - cron: "30 0 * * *"
  workflow_dispatch: {}   # lets you trigger a run by hand from the Actions tab

# Never let two runs overlap (they'd race on the results commit).
concurrency:
  group: nightly-eval
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit results back to the repo

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/requirements.txt

      - name: Install dependencies
        run: pip install -r eval/requirements.txt

      - name: Self-test the statistics
        working-directory: eval
        run: pytest -q

      - name: Run eval suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"   # stream progress live so a stall is diagnosable
        run: python -u eval/run_eval.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json public/data/history.jsonl
          if git diff --staged --quiet; then
            echo "No change in results — nothing to commit."
          else
            git commit -m "chore(eval): nightly run $(date -u +'%Y-%m-%d')"
            git push
          fi
