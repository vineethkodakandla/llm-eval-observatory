# Models under test: Groq *production* models with open weights, on the free tier.
#
# Refreshed 2026-09-15 from GET /models using the repo's own key (Actions run
# 35011193148):
#   * removed llama-3.3-70b-versatile and llama-3.1-8b-instant. Groq's
#     deprecations page lists both as shut down on 2026-08-16, and every nightly
#     run since 2026-08-18 got HTTP 404 for them.
#   * removed qwen/qwen3.6-27b, a preview model. It was rate-limited (429) through
#     2026-09-14 and gone from the catalog (404) on 2026-09-15. Its preview
#     successor qwen/qwen3.8-27b is reachable but not added: preview IDs have been
#     swapped twice since July (qwen3-32b -> qwen3.6-27b -> qwen3.8-27b).
#   The two GPT-OSS sizes are the only production open-weight chat models left.
#
# Free-tier budget, per model:
#   limits    1,000 requests/day and 8,000 tokens/min (Groq response headers),
#             200,000 tokens/day (Groq rate-limit docs)
#   one run   154-157 requests and 61-66K tokens (nightly snapshots 2026-09-05..15)
# so the nightly run uses ~16% of the request allowance and ~33% of the token
# allowance, leaving room for one manual re-run a day.
#
# Model IDs drift over time. To refresh, hit the live catalog:
#   curl https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY"
# and update the `id` fields below. `label` and `family` are display-only.
#
# `tier: production` models are stable; `preview` models are eval-only and
# may be discontinued by Groq with little notice (the runner logs & skips a 404).
# Per-model request overrides go under `params:`, e.g. `reasoning_format: parsed`
# for a Qwen reasoning model so its <think> block stays out of `content`.

provider: groq
endpoint: https://api.groq.com/openai/v1/chat/completions

# Generation defaults (kept small to stay well under the free-tier token limits).
defaults:
  temperature: 0.0        # deterministic grading
  max_tokens: 1024        # headroom for reasoning models to finish thinking AND answer
  request_timeout_sec: 60

models:
  - id: openai/gpt-oss-20b
    label: GPT-OSS 20B
    family: OpenAI OSS
    tier: production
    weights: open        # Apache-2.0 open weights

  - id: openai/gpt-oss-120b
    label: GPT-OSS 120B
    family: OpenAI OSS
    tier: production
    weights: open        # Apache-2.0 open weights
